[package]
name = "display-overlay-poc"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "display-overlay-poc"
path = "src/main.rs"

[dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 2